                      "off" to "متوقف",
                      "on" to "يعمل  |  مستوى الصوت: ",
                      "thr" to "حد التنبيه: ",
                      "thrHint" to "(كلما قلّ الحد جاء التنبيه أبكر)",
                      "start" to "ابدأ",
                      "stop" to "إيقاف",
                      "vib" to "اختبار الاهتزاز",
                      "voiceTest" to "اختبار الصوت",
                      "voiceSwitch" to "قراءة التذكير بصوت عالٍ",
                      "overlay" to "السماح بالعرض فوق التطبيقات الأخرى",
                      "langLabel" to "اللغة",
                      "customLabel" to "نصّك الخاص (دعاء أو ذكر أو أي كلمات). اترك سطرًا فارغًا بين النصوص المختلفة. اتركه فارغًا لاستخدام الرسائل الافتراضية.",
                      "clangLabel" to "لغة الصوت لنصّك",
                      "note" to "لا يسجّل هذا التطبيق الصوت، بل يقيس شدّته فقط.\nبعد البدء يمكنك قفل الهاتف ووضعه في جيبك.\nإذا بقي المستوى 0 أثناء المكالمة فضع المكالمة على مكبّر الصوت وجرّب مجددًا.",
                      "dismiss" to "حسنًا، أنا هادئ - إغلاق",
                      "alertTitle" to "لحظة من فضلك",
                      "notifTitle" to "رفيق الهدوء يعمل",
                      "notifText" to "تُقاس شدّة الصوت فقط ولا يتم التسجيل",
                      "m1" to "خذ نفسًا عميقًا وابقَ هادئًا",
                      "m2" to "اهدأ، أنت قادر على التحكم",
                      "m3" to "اخفض صوتك قليلًا، كل شيء بخير",
                      "m4" to "اهدأ، ستُحل الأمور بهدوء"
                  )
              )

              fun get(lang: String, key: String): String {
                  val en = data["en"]!!
                  val m = data[lang] ?: en
                  return m[key] ?: en[key] ?: key
              }
          }

          object Pick {
              private var idx = 0

              fun next(prefs: SharedPreferences, lang: String): Triple<String, String, String> {
                  val raw = prefs.getString("custom", "") ?: ""
                  val parts = raw.trim().split(Regex("\\n\\s*\\n")).map { it.trim() }.filter { it.isNotEmpty() }
                  if (parts.isNotEmpty()) {
                      val text = parts[idx % parts.size]
                      idx++
                      val vl = prefs.getString("clang", lang) ?: lang
                      return Triple(text, vl, "")
                  }
                  val key = arrayOf("m1", "m2", "m3", "m4").random()
                  return Triple(L.get(lang, key), lang, L.get("en", key))
              }
          }

          object Voice {
              private var tts: TextToSpeech? = null
              private var ready = false
              private var pending: Triple<String, String, String>? = null
              @Volatile var speaking = false

              fun init(ctx: Context) {
                  if (tts != null) return
                  tts = TextToSpeech(ctx.applicationContext) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          ready = true
                          tts?.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build()
                          )
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) { speaking = true }
                              override fun onDone(utteranceId: String?) { speaking = false }
                              override fun onError(utteranceId: String?) { speaking = false }
                          })
                          val p = pending
                          if (p != null) {
                              pending = null
                              speak(p.first, p.second, p.third)
                          }
                      }
                  }
              }

              fun speak(lang: String, text: String, fallbackEnglish: String) {
                  val t = tts
                  if (t == null || !ready) {
                      pending = Triple(lang, text, fallbackEnglish)
                      return
                  }
                  var say = text
                  val r = t.setLanguage(Locale(lang))
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                      t.setLanguage(Locale.ENGLISH)
                      say = fallbackEnglish
                  }
                  if (say.isBlank()) return
                  t.setSpeechRate(0.9f)
                  t.speak(say.take(3500), TextToSpeech.QUEUE_FLUSH, null, "calm")
              }

              fun stop() {
                  try { tts?.stop() } catch (e: Exception) {}
                  speaking = false
              }
          }
          EOF

          cat > calm/app/src/main/java/com/zubair/calmapp/CalmService.kt <<'EOF'
          package com.zubair.calmapp

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.Icon
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class CalmService : Service() {

              companion object {
                  @Volatile var level = 0
                  @Volatile var running = false
                  const val CH_ONGOING = "calm_ongoing"
                  const val CH_ALERT = "calm_alert"

                  fun buzz(ctx: Context) {
                      val v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      val effect = VibrationEffect.createWaveform(
                          longArrayOf(0, 700, 250, 700, 250, 700), -1
                      )
                      val attrs = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()
                      v.vibrate(effect, attrs)
                  }
              }

              @Volatile private var active = false
              private var worker: Thread? = null
              private var wake: PowerManager.WakeLock? = null
              private var lastAlert = 0L
              private val main = Handler(Looper.getMainLooper())
              private var overlay: View? = null
              private val autoHide = Runnable { removeOverlay() }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Voice.init(this)
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CH_ONGOING, "Running", NotificationManager.IMPORTANCE_LOW)
                  )
                  val alertCh = NotificationChannel(CH_ALERT, "Reminder", NotificationManager.IMPORTANCE_HIGH)
                  alertCh.enableVibration(false)
                  alertCh.setSound(null, null)
                  nm.createNotificationChannel(alertCh)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "DISMISS") {
                      dismissAll()
                      if (!active) stopSelf()
                      return START_NOT_STICKY
                  }
                  val lang = getSharedPreferences("calm", Context.MODE_PRIVATE).getString("lang", "en") ?: "en"
                  val n = Notification.Builder(this, CH_ONGOING)
                      .setContentTitle(L.get(lang, "notifTitle"))
                      .setContentText(L.get(lang, "notifText"))
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  if (!active) {
                      active = true
                      running = true
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "calm:mic")
                      wake?.acquire()
                      worker = Thread { loop() }
                      worker?.start()
                  }
                  return START_NOT_STICKY
              }

              private fun loop() {
                  val rate = 16000
                  val minBuf = AudioRecord.getMinBufferSize(
                      rate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  val size = maxOf(minBuf, 8000)
                  val rec: AudioRecord? = try {
                      AudioRecord(
                          MediaRecorder.AudioSource.VOICE_RECOGNITION, rate,
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, size
                      )
                  } catch (e: Exception) {
                      null
                  }
                  if (rec == null || rec.state != AudioRecord.STATE_INITIALIZED) {
                      running = false
                      stopSelf()
                      return
                  }
                  val prefs = getSharedPreferences("calm", Context.MODE_PRIVATE)
                  val buf = ShortArray(1600)
                  var high = 0
                  try {
                      rec.startRecording()
                      while (active) {
                          val n = rec.read(buf, 0, buf.size)
                          if (n <= 0) {
                              Thread.sleep(50)
                              continue
                          }
                          var sum = 0.0
                          for (i in 0 until n) {
                              val s = buf[i] / 32768.0
                              sum += s * s
                          }
                          val rms = Math.sqrt(sum / n)
                          val db = 20 * Math.log10(maxOf(rms, 1e-6))
                          val lvl = (((db + 60) / 60.0) * 100).toInt().coerceIn(0, 100)
                          level = lvl
                          if (Voice.speaking) {
                              high = 0
                              continue
                          }
                          val thr = prefs.getInt("thr", 70)
                          if (lvl >= thr) high++ else high = 0
                          val now = SystemClock.elapsedRealtime()
                          if (high >= 5 && now - lastAlert > 20000) {
                              lastAlert = now
                              high = 0
                              alert()
                          }
                      }
                  } catch (e: Exception) {
                  } finally {
                      try { rec.stop() } catch (e: Exception) {}
                      rec.release()
                      level = 0
                  }
              }

              private fun alert() {
                  val prefs = getSharedPreferences("calm", Context.MODE_PRIVATE)
                  val lang = prefs.getString("lang", "en") ?: "en"
                  val picked = Pick.next(prefs, lang)
                  val msg = picked.first

                  val pi = PendingIntent.getService(
                      this, 0,
                      Intent(this, CalmService::class.java).setAction("DISMISS"),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val act = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel),
                      L.get(lang, "dismiss"),
                      pi
                  ).build()
                  val n = Notification.Builder(this, CH_ALERT)
                      .setContentTitle(L.get(lang, "alertTitle"))
                      .setContentText(msg)
                      .setStyle(Notification.BigTextStyle().bigText(msg))
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .addAction(act)
                      .build()
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(2, n)

                  buzz(this)
                  if (prefs.getBoolean("voice", true)) {
                      Voice.speak(picked.second, msg, picked.third)
                  }
                  showOverlay(msg, lang)
              }

              private fun showOverlay(msg: String, lang: String) {
                  if (!Settings.canDrawOverlays(this)) return
                  main.post {
                      removeOverlay()
                      val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      val pad = (20 * resources.displayMetrics.density).toInt()
                      val box = LinearLayout(this)
                      box.orientation = LinearLayout.VERTICAL
                      box.setBackgroundColor(Color.parseColor("#F01B5E20"))
                      box.setPadding(pad, pad, pad, pad)
                      val t = TextView(this)
                      t.text = msg
                      t.textSize = if (msg.length > 120) 18f else 28f
                      t.setTextColor(Color.WHITE)
                      t.gravity = Gravity.CENTER
                      t.setPadding(0, pad, 0, pad)
                      box.addView(t)
                      val b = Button(this)
                      b.text = L.get(lang, "dismiss")
                      b.setTextColor(Color.BLACK)
                      b.setBackgroundColor(Color.WHITE)
                      b.setOnClickListener { dismissAll() }
                      box.addView(b)
                      val lp = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      )
                      lp.gravity = Gravity.TOP
                      try {
                          wm.addView(box, lp)
                          overlay = box
                      } catch (e: Exception) {
                      }
                      main.removeCallbacks(autoHide)
                      main.postDelayed(autoHide, 180000)
                  }
              }

              private fun removeOverlay() {
                  val v = overlay ?: return
                  try {
                      val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      wm.removeView(v)
                  } catch (e: Exception) {
                  }
                  overlay = null
              }

              private fun dismissAll() {
                  Voice.stop()
                  main.post { removeOverlay() }
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.cancel(2)
              }

              override fun onDestroy() {
                  active = false
                  running = false
                  level = 0
                  Voice.stop()
                  removeOverlay()
                  try { wake?.release() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          EOF

          cat > calm/app/src/main/java/com/zubair/calmapp/MainActivity.kt <<'EOF'
          package com.zubair.calmapp

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Spinner
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var meter: ProgressBar
              private lateinit var status: TextView
              private lateinit var thrText: TextView
              private lateinit var toggle: Button
              private var lang = "en"
              private val handler = Handler(Looper.getMainLooper())

              private val tick = object : Runnable {
                  override fun run() {
                      meter.progress = CalmService.level
                      if (CalmService.running) {
                          status.text = L.get(lang, "on") + CalmService.level
                          toggle.text = L.get(lang, "stop")
                      } else {
                          status.text = L.get(lang, "off")
                          toggle.text = L.get(lang, "start")
                      }
                      handler.postDelayed(this, 150)
                  }
              }

              private fun thrLabel(v: Int): String {
                  return L.get(lang, "thr") + v + "\n" + L.get(lang, "thrHint")
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("calm", MODE_PRIVATE)
                  lang = prefs.getString("lang", "en") ?: "en"
                  Voice.init(this)

                  val pad = (20 * resources.displayMetrics.density).toInt()
                  val wide = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  )

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  fun label(s: String, size: Float): TextView {
                      val t = TextView(this)
                      t.text = s
                      t.textSize = size
                      t.setTextColor(Color.WHITE)
                      t.gravity = Gravity.CENTER
                      t.setPadding(0, pad / 2, 0, pad / 2)
                      return t
                  }

                  root.addView(label(L.get(lang, "title"), 24f), wide)

                  root.addView(label(L.get(lang, "langLabel"), 14f), wide)
                  val sp = Spinner(this)
                  sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, L.names)
                  sp.setSelection(L.codes.indexOf(lang))
                  sp.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                          val c = L.codes[pos]
                          if (c != lang) {
                              prefs.edit().putString("lang", c).apply()
                              recreate()
                          }
                      }
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }
                  root.addView(sp, wide)

                  status = label(L.get(lang, "off"), 18f)
                  root.addView(status, wide)

                  meter = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  meter.max = 100
                  root.addView(meter, wide)

                  val start = prefs.getInt("thr", 70)
                  thrText = label(thrLabel(start), 16f)
                  root.addView(thrText, wide)

                  val seek = SeekBar(this)
                  seek.max = 75
                  seek.progress = start - 20
                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          val v = p + 20
                          prefs.edit().putInt("thr", v).apply()
                          thrText.text = thrLabel(v)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  root.addView(seek, wide)

                  val sw = Switch(this)
                  sw.text = L.get(lang, "voiceSwitch")
                  sw.setTextColor(Color.WHITE)
                  sw.isChecked = prefs.getBoolean("voice", true)
                  sw.setOnCheckedChangeListener { _, checked ->
                      prefs.edit().putBoolean("voice", checked).apply()
                  }
                  root.addView(sw, wide)

                  root.addView(label(L.get(lang, "customLabel"), 14f), wide)
                  val et = EditText(this)
                  et.setText(prefs.getString("custom", "") ?: "")
                  et.setTextColor(Color.WHITE)
                  et.minLines = 3
                  et.gravity = Gravity.TOP
                  et.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                  et.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          prefs.edit().putString("custom", s?.toString() ?: "").apply()
                      }
                  })
                  root.addView(et, wide)

                  root.addView(label(L.get(lang, "clangLabel"), 14f), wide)
                  val sp2 = Spinner(this)
                  sp2.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, L.names)
                  sp2.setSelection(L.codes.indexOf(prefs.getString("clang", lang) ?: lang))
                  sp2.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                          val c = L.codes[pos]
                          if (c != (prefs.getString("clang", lang) ?: lang)) {
                              prefs.edit().putString("clang", c).apply()
                          }
                      }
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }
                  root.addView(sp2, wide)

                  toggle = Button(this)
                  toggle.text = L.get(lang, "start")
                  toggle.setOnClickListener {
                      if (CalmService.running) {
                          stopService(Intent(this, CalmService::class.java))
                      } else {
                          begin()
                      }
                  }
                  root.addView(toggle, wide)

                  val vt = Button(this)
                  vt.text = L.get(lang, "voiceTest")
                  vt.setOnClickListener {
                      Voice.init(this)
                      val pk = Pick.next(prefs, lang)
                      Voice.speak(pk.second, pk.first, pk.third)
                  }
                  root.addView(vt, wide)

                  val test = Button(this)
                  test.text = L.get(lang, "vib")
                  test.setOnClickListener { CalmService.buzz(this) }
                  root.addView(test, wide)

                  val ov = Button(this)
                  ov.text = L.get(lang, "overlay")
                  ov.setOnClickListener {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + packageName)
                          )
                      )
                  }
                  root.addView(ov, wide)

                  root.addView(label(L.get(lang, "note"), 14f), wide)

                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(Color.parseColor("#101820"))
                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun begin() {
                  val need = ArrayList<String>()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (need.isNotEmpty()) {
                      requestPermissions(need.toTypedArray(), 1)
                      return
                  }
                  startForegroundService(Intent(this, CalmService::class.java))
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int, permissions: Array<out String>, grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      startForegroundService(Intent(this, CalmService::class.java))
                  }
              }

              override fun onResume() {
                  super.onResume()
                  handler.post(tick)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(tick)
              }
          }
          EOF

      - name: Build APK
        run: gradle -p calm assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            calm/app/build/outputs/apk/debug/app-debug.apk \
