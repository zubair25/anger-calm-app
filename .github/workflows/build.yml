name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create project files
        run: |
          mkdir -p calm/app/src/main/java/com/zubair/calmapp

          cat > calm/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CalmApp"
          include(":app")
          EOF

          cat > calm/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > calm/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > calm/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.zubair.calmapp'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.zubair.calmapp'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > calm/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:label="Calm Guard"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CalmService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat > calm/app/src/main/java/com/zubair/calmapp/CalmService.kt <<'EOF'
          package com.zubair.calmapp

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator

          class CalmService : Service() {

              companion object {
                  @Volatile var level = 0
                  @Volatile var running = false
                  const val CH_ONGOING = "calm_ongoing"
                  const val CH_ALERT = "calm_alert"

                  fun buzz(ctx: Context) {
                      val v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      v.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 200, 150, 200), -1))
                  }
              }

              @Volatile private var active = false
              private var worker: Thread? = null
              private var wake: PowerManager.WakeLock? = null
              private var lastAlert = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CH_ONGOING, "Running", NotificationManager.IMPORTANCE_LOW)
                  )
                  val alertCh = NotificationChannel(CH_ALERT, "Reminder", NotificationManager.IMPORTANCE_HIGH)
                  alertCh.enableVibration(false)
                  alertCh.setSound(null, null)
                  nm.createNotificationChannel(alertCh)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val n = Notification.Builder(this, CH_ONGOING)
                      .setContentTitle("پرسکون ایپ چل رہی ہے")
                      .setContentText("صرف آواز کی بلندی ناپی جاتی ہے، ریکارڈنگ نہیں ہوتی")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  if (!active) {
                      active = true
                      running = true
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "calm:mic")
                      wake?.acquire()
                      worker = Thread { loop() }
                      worker?.start()
                  }
                  return START_NOT_STICKY
              }

              private fun loop() {
                  val rate = 16000
                  val minBuf = AudioRecord.getMinBufferSize(
                      rate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                  )
                  val size = maxOf(minBuf, 8000)
                  val rec: AudioRecord? = try {
                      AudioRecord(
                          MediaRecorder.AudioSource.VOICE_RECOGNITION, rate,
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, size
                      )
                  } catch (e: Exception) {
                      null
                  }
                  if (rec == null || rec.state != AudioRecord.STATE_INITIALIZED) {
                      running = false
                      stopSelf()
                      return
                  }
                  val prefs = getSharedPreferences("calm", Context.MODE_PRIVATE)
                  val buf = ShortArray(1600)
                  var high = 0
                  try {
                      rec.startRecording()
                      while (active) {
                          val n = rec.read(buf, 0, buf.size)
                          if (n <= 0) {
                              Thread.sleep(50)
                              continue
                          }
                          var sum = 0.0
                          for (i in 0 until n) {
                              val s = buf[i] / 32768.0
                              sum += s * s
                          }
                          val rms = Math.sqrt(sum / n)
                          val db = 20 * Math.log10(maxOf(rms, 1e-6))
                          val lvl = (((db + 60) / 60.0) * 100).toInt().coerceIn(0, 100)
                          level = lvl
                          val thr = prefs.getInt("thr", 70)
                          if (lvl >= thr) high++ else high = 0
                          val now = SystemClock.elapsedRealtime()
                          if (high >= 5 && now - lastAlert > 15000) {
                              lastAlert = now
                              high = 0
                              alert()
                          }
                      }
                  } catch (e: Exception) {
                  } finally {
                      try { rec.stop() } catch (e: Exception) {}
                      rec.release()
                      level = 0
                  }
              }

              private fun alert() {
                  val msgs = arrayOf(
                      "ایک گہری سانس لیں، آرام سے",
                      "پرسکون رہیں، آپ سنبھال سکتے ہیں",
                      "آواز ذرا ہلکی کر لیں، سب ٹھیک ہے",
                      "ٹھنڈے رہیں، بات آرام سے ہو جائے گی"
                  )
                  val n = Notification.Builder(this, CH_ALERT)
                      .setContentTitle("ایک لمحہ")
                      .setContentText(msgs.random())
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setAutoCancel(true)
                      .setTimeoutAfter(8000)
                      .build()
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(2, n)
                  buzz(this)
              }

              override fun onDestroy() {
                  active = false
                  running = false
                  level = 0
                  try { wake?.release() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          EOF

          cat > calm/app/src/main/java/com/zubair/calmapp/MainActivity.kt <<'EOF'
          package com.zubair.calmapp

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var meter: ProgressBar
              private lateinit var status: TextView
              private lateinit var thrText: TextView
              private lateinit var toggle: Button
              private val handler = Handler(Looper.getMainLooper())

              private val tick = object : Runnable {
                  override fun run() {
                      meter.progress = CalmService.level
                      if (CalmService.running) {
                          status.text = "چل رہی ہے  |  آواز کی سطح: " + CalmService.level
                          toggle.text = "بند کریں"
                      } else {
                          status.text = "ابھی بند ہے"
                          toggle.text = "شروع کریں"
                      }
                      handler.postDelayed(this, 150)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("calm", MODE_PRIVATE)
                  val pad = (20 * resources.displayMetrics.density).toInt()
                  val wide = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  )

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  fun label(s: String, size: Float): TextView {
                      val t = TextView(this)
                      t.text = s
                      t.textSize = size
                      t.setTextColor(Color.WHITE)
                      t.gravity = Gravity.CENTER
                      t.setPadding(0, pad / 2, 0, pad / 2)
                      return t
                  }

                  root.addView(label("پرسکون رہنے والا ساتھی", 24f), wide)

                  status = label("ابھی بند ہے", 18f)
                  root.addView(status, wide)

                  meter = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  meter.max = 100
                  root.addView(meter, wide)

                  val start = prefs.getInt("thr", 70)
                  thrText = label("", 16f)
                  thrText.text = "الارم کی حد: " + start + "\n(حد کم ہو تو یاد دہانی جلدی آئے گی)"
                  root.addView(thrText, wide)

                  val seek = SeekBar(this)
                  seek.max = 75
                  seek.progress = start - 20
                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          val v = p + 20
                          prefs.edit().putInt("thr", v).apply()
                          thrText.text = "الارم کی حد: " + v + "\n(حد کم ہو تو یاد دہانی جلدی آئے گی)"
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  root.addView(seek, wide)

                  toggle = Button(this)
                  toggle.text = "شروع کریں"
                  toggle.setOnClickListener {
                      if (CalmService.running) {
                          stopService(Intent(this, CalmService::class.java))
                      } else {
                          begin()
                      }
                  }
                  root.addView(toggle, wide)

                  val test = Button(this)
                  test.text = "وائبریشن ٹیسٹ"
                  test.setOnClickListener { CalmService.buzz(this) }
                  root.addView(test, wide)

                  root.addView(
                      label(
                          "یہ ایپ آواز ریکارڈ نہیں کرتی، صرف بلندی ناپتی ہے۔\n" +
                          "شروع کرنے کے بعد فون جیب میں رکھ سکتے ہیں۔\n" +
                          "اگر کال کے دوران سطح 0 رہے تو کال سپیکر پر رکھ کر آزمائیں۔",
                          14f
                      ), wide
                  )

                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(Color.parseColor("#101820"))
                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun begin() {
                  val need = ArrayList<String>()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (need.isNotEmpty()) {
                      requestPermissions(need.toTypedArray(), 1)
                      return
                  }
                  startForegroundService(Intent(this, CalmService::class.java))
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int, permissions: Array<out String>, grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      startForegroundService(Intent(this, CalmService::class.java))
                  }
              }

              override fun onResume() {
                  super.onResume()
                  handler.post(tick)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(tick)
              }
          }
          EOF

      - name: Build APK
        run: gradle -p calm assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            calm/app/build/outputs/apk/debug/app-debug.apk \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Calm Guard APK"
